name: lrr_api_test

services:
  lrr:
    image: difegue/lanraragi:v.0.9.81@sha256:6376a3de75c8a4045aadeb252eee9661ee9baf27965cec7a405a2b246d2937b3
    container_name: lrr_api_test_lrr
    ports:
      - 33333:3000
    volumes:
      - ${LRR_TEST_CONTENT_FOLDER:?LRR_TEST_CONTENT_FOLDER not set}:/home/koyomi/lanraragi/content
    #   - [YOUR_THUMBNAIL_DIRECTORY]:/home/koyomi/lanraragi/thumb
    #   - [YOUR_DATABASE_DIRECTORY]:/home/koyomi/lanraragi/database

    # copy the health check command from tools/build/docker/Dockerfile, and update the frequency
    healthcheck:
      test: "wget --quiet --tries=1 --no-check-certificate --spider -Y off http://127.0.0.1:3000 || exit 1"
      interval: 5s
      timeout: 3s
      retries: 1
    security_opt:
      - no-new-privileges:true
    memswap_limit: 4g # disable swap with the same value as mem limit
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
          pids: 512
