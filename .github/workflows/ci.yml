name: Continuous Integration

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
      - "src/**"
      - "tests/**"
      - ".python-version"
      - "demo.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/python-uv-setup

      - name: Install the project
        run: make install UV_OPTS="--locked --all-extras"

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Docs in sync with code
        run: make docs.gen-check

      - name: Unit test
        run: |
          echo -e "## Unit Test Coverage\n\n" >> $GITHUB_STEP_SUMMARY
          make test.unit PYTEST_OPTS="--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
          echo -e "\n\n" >> $GITHUB_STEP_SUMMARY

      - name: Integration test
        run: |
          echo -e "## Integration Test Coverage\n\n" >> $GITHUB_STEP_SUMMARY
          make test.integration PYTEST_OPTS="--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
          echo -e "\n\n" >> $GITHUB_STEP_SUMMARY
