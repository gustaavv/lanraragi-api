name: Continuous Integration

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - ".python-version"
      - "demo.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: ./.github/actions/python-uv-setup

      - name: Install the project
        run: make install UV_OPTS="--locked --all-extras"

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Docs in sync with code
        run: make docs.gen-check

      - name: Unit test
        run: |
          echo -e "## Unit Test Coverage\n\n" >> $GITHUB_STEP_SUMMARY
          make test.unit PYTEST_OPTS="--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
          echo -e "\n\n" >> $GITHUB_STEP_SUMMARY

      - name: Upload unit coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: docs/build/html/coverage/unit
          if-no-files-found: error
          retention-days: 7

      - name: Integration test
        run: |
          echo -e "## Integration Test Coverage\n\n" >> $GITHUB_STEP_SUMMARY
          make test.integration PYTEST_OPTS="--cov-report=markdown-append:$GITHUB_STEP_SUMMARY"
          echo -e "\n\n" >> $GITHUB_STEP_SUMMARY

      - name: Upload integration coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: docs/build/html/coverage/integration
          if-no-files-found: error
          retention-days: 7
