name: Build and Deploy Docs

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - master

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run also fires for runs on other repositories (a fork branch named
    # master passes the branches filter), hence the head_repository guard.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # github.sha points at the default branch on workflow_run events, so the
      # short hash has to come from the triggering run's head_sha instead.
      - name: Set short commit hash
        id: commit
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short_sha=${COMMIT_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup Python and uv
        uses: ./.github/actions/python-uv-setup

      - name: Install the docs dependencies
        run: make install.docs UV_OPTS="--locked"

      - name: Build docs
        run: make docs.build

      - name: Download unit coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-unit-${{ steps.commit.outputs.short_sha }}
          path: docs/build/html/coverage/unit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download integration coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration-${{ steps.commit.outputs.short_sha }}
          path: docs/build/html/coverage/integration
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
